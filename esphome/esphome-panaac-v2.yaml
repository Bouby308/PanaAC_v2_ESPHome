substitutions:
  device_name: "esphome-panaac-v2"
  device_friendlyname: "ESPHome_PanaAC_v2"

esphome:
  name: "${device_name}"
  friendly_name: "${device_friendlyname}"
  min_version: 2025.9.0
  name_add_mac_suffix: false

# Load the panaac_v2 custom component from the sibling components/ folder.
external_components:
  - source: components

# Wemos D1 mini / NodeMCU ESP-12E (ESP8266, 4 MB flash).
esp8266:
  board: d1_mini

# Enable logging
logger:

# Native Home Assistant API — exposes the "(PanaAC v1)" climate and the three "(PanaAC v1)"
# selects at the root of the ESPHome device, exactly like PanaAC v1. The full-featured v2 climate
# card comes from the PanaAC v2 HA custom integration over MQTT (separate device).
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-ap"
    password: !secret wifi_ap_password

captive_portal:

# MQTT broker (the same broker used by Home Assistant).
# Availability is driven by birth/last-will on the panaac_v2 availability topic so the
# PanaAC v2 HA integration reliably sees online/offline (incl. broker restart / device crash).
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_pass
  # Discovery is OFF: the full-featured v2 climate is exposed via the PanaAC v2 HA custom
  # integration over the panaac_v2/<prefix>/... topics (not via standard MQTT discovery, which
  # would create a duplicate climate). The "(PanaAC v1)" climate and the three "(PanaAC v1)"
  # selects are exposed via the native API (see `api:` above) — ESPHome only MQTT-discovers
  # platform entities, not programmatically-created selects, so the native API is their
  # transport.
  discovery: false
  birth_message:
    topic: "panaac_v2/${device_name}/availability"
    payload: "online"
    retain: true
  will_message:
    topic: "panaac_v2/${device_name}/availability"
    payload: "offline"
    retain: true
  # Published by ESPHome on a GRACEFUL shutdown (reboot / OTA / safe mode) right before the
  # clean MQTT disconnect. The broker does NOT send the last-will on a clean disconnect, so
  # without this HA would keep seeing "online" while the device is down. Hard crashes / power
  # loss / WiFi drops are still caught by the last-will above (after keepalive timeout).
  shutdown_message:
    topic: "panaac_v2/${device_name}/availability"
    payload: "offline"
    retain: true

# Non-invasive wiring: separate IR receiver and IR LED.
#   GPIO14 = D5  <- IR receiver (TSOP38xxx) data pin
#   GPIO13 = D7  <- IR LED anode (via transistor) — 38 kHz carrier, ir_control: true
remote_receiver:
  pin:
    number: GPIO14
    inverted: True
  tolerance: 55%
  id: ir_receiver
  idle: 5ms

remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO13
  id: ir_transmitter

# Example optional temperature sensor.
# Using a dummy template sensor that reports a fixed 26.5 °C for testing.
sensor:
  - platform: template
    name: "Room Temperature"
    id: room_temp
    lambda: return 26.5;
    update_interval: 30s
    unit_of_measurement: "°C"
    device_class: temperature

panaac_v2:
  name: "Remote Controller"
  id: panaac_v2_climate
  receiver_id: ir_receiver
  transmitter_id: ir_transmitter
  # Setting topic_prefix enables v2 MQTT mode: the full-featured v2 climate is exposed over the
  # custom panaac_v2/<prefix>/... MQTT JSON topics (consumed by the PanaAC v2 HA custom
  # integration). The "(PanaAC v1)" climate and the three "(PanaAC v1)" selects are ALSO created
  # and kept visible on the native API, at the root of the ESPHome device (no sub-device),
  # exactly like PanaAC v1. The v2 custom topics are independent of the native ClimateTraits, so
  # the v2 HA card is unaffected.
  topic_prefix: "panaac_v2/${device_name}"
  supports_cool: true
  supports_heat: true
  supports_fan_only: true
  supports_quiet: true
  fan_5level: true
  swing_horizontal: true
  temp_step: 0.5
  ir_control: true
  sensor: room_temp
  # Standard Climate automations are supported (uncomment to use):
  # on_state:
  #   - lambda: |-
  #       ESP_LOGD("panaac", "Climate state updated, mode=%s", climate_mode_to_string(x.mode));
  # on_control:
  #   - lambda: |-
  #       if (x.get_mode().has_value()) {
  #         ESP_LOGD("panaac", "Control call, mode=%s", climate_mode_to_string(x.get_mode().value()));
  #       }
