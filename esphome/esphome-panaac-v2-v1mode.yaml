substitutions:
  device_name: "esphome-panaac-v2-v1"
  device_friendlyname: "ESPHome_PanaAC_v2 (v1 mode)"

esphome:
  name: "${device_name}"
  friendly_name: "${device_friendlyname}"
  min_version: 2025.9.0
  name_add_mac_suffix: false

# Load the panaac_v2 custom component from the sibling components/ folder.
external_components:
  - source: components

# Wemos D1 mini / NodeMCU ESP-12E (ESP8266, 4 MB flash).
esp8266:
  board: d1_mini

# Enable logging
logger:

# Native Home Assistant API — the climate + 3 selects are exposed here (v1 mode).
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-ap"
    password: !secret wifi_ap_password

captive_portal:

# v1 mode uses the native API (above) to expose the climate + 3 selects — no MQTT broker is
# required. If you do add a `mqtt:` block, the climate is additionally published via ESPHome's
# standard MQTT discovery (like PanaAC v1); the three selects stay on the native API. Either
# way, NO `topic_prefix` is set on panaac_v2 below, so the custom v2 MQTT topics are NOT used.

# Non-invasive wiring: separate IR receiver and IR LED.
#   GPIO14 = D5  <- IR receiver (TSOP38xxx) data pin, inverted
#   GPIO13 = D7  <- IR LED anode (via transistor) — 38 kHz carrier, ir_control: true
remote_receiver:
  pin:
    number: GPIO14
    inverted: True
  tolerance: 55%
  id: ir_receiver
  idle: 5ms

remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO13
  id: ir_transmitter

# Example optional temperature sensor.
sensor:
  - platform: template
    name: "Room Temperature"
    id: room_temp
    lambda: return 26.5;
    update_interval: 30s
    unit_of_measurement: "°C"
    device_class: temperature

# v1 native mode: NO topic_prefix. The component behaves like PanaAC v1 — a native climate
# (standard fan/swing enums, named "<name> (PanaAC v1)") plus the three (PanaAC v1) selects
# (Fan Level / Swing Vertical / Swing Horizontal), all at the root of the ESPHome device (no
# sub-device), exactly like PanaAC_ESPHome. The "(PanaAC v1)" name suffix is added by the
# component in both modes. (Optionally set `device_id` + an `esphome.devices` sub-device to
# regroup them under a named sub-device — issue #15.)
panaac_v2:
  name: "Remote Controller"
  id: panaac_v2_climate
  receiver_id: ir_receiver
  transmitter_id: ir_transmitter
  supports_cool: true
  supports_heat: true
  supports_fan_only: true
  supports_quiet: true
  fan_5level: true
  swing_horizontal: true
  temp_step: 0.5
  ir_control: true
  sensor: room_temp