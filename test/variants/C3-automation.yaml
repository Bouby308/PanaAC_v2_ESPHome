substitutions:
  device_name: "esphome-panaac-v2"
  device_friendlyname: "ESPHome_PanaAC_v2"

esphome:
  name: "${device_name}"
  friendly_name: "${device_friendlyname}"
  min_version: 2025.9.0
  name_add_mac_suffix: false
  build_path: .esphome/build/c3-automation

external_components:
  - source: ../../esphome/components

esp8266:
  board: d1_mini

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "${device_name}-ap"
    password: !secret wifi_ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false

remote_receiver:
  pin:
    number: GPIO14
    inverted: True
  tolerance: 55%
  id: ir_receiver
  idle: 5ms

remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO13
  id: ir_transmitter

sensor:
  - platform: template
    name: "Room Temperature"
    id: room_temp
    lambda: return 26.5;
    update_interval: 30s
    unit_of_measurement: "°C"
    device_class: temperature

panaac_v2:
  name: "Remote Controller"
  id: panaac_v2_climate
  receiver_id: ir_receiver
  transmitter_id: ir_transmitter
  topic_prefix: "panaac_v2/${device_name}"
  hide_legacy_comps: false
  supports_cool: true
  supports_heat: true
  supports_fan_only: true
  supports_quiet: true
  fan_5level: true
  swing_horizontal: true
  temp_step: 0.5
  ir_control: true
  sensor: room_temp
  on_state:
    - logger.log: "on_state fired"
  on_control:
    - logger.log: "on_control fired"

button:
  - platform: template
    name: "Control cool 24C"
    on_press:
      - climate.control:
          id: panaac_v2_climate
          mode: COOL
          target_temperature: 24.0
          fan_mode: AUTO
          swing_mode: VERTICAL

  - platform: template
    name: "Lambda action log"
    on_press:
      - lambda: |-
          ESP_LOGI("test", "mode=%d action=%d cur=%.1f tgt=%.1f",
                   (int) id(panaac_v2_climate).mode,
                   (int) id(panaac_v2_climate).action,
                   id(panaac_v2_climate).current_temperature,
                   id(panaac_v2_climate).target_temperature);

  - platform: template
    name: "Lambda make_call cool 24C"
    on_press:
      - lambda: |-
          auto call = id(panaac_v2_climate).make_call();
          call.set_mode("COOL");
          call.set_target_temperature(24.0f);
          call.set_fan_mode("Level 2");
          call.set_swing_mode("Vertical");
          call.perform();
