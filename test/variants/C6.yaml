substitutions:
  device_name: "esphome-panaac-v2"
  device_friendlyname: "ESPHome_PanaAC_v2"

esphome:
  name: "${device_name}"
  friendly_name: "${device_friendlyname}"
  min_version: 2025.9.0
  name_add_mac_suffix: false
  build_path: .esphome/build/c6

external_components:
  - source: ../../esphome/components

esp8266:
  board: d1_mini

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "${device_name}-ap"
    password: !secret wifi_ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false

remote_receiver:
  pin:
    number: GPIO14
    inverted: True
  tolerance: 55%
  id: ir_receiver
  idle: 5ms

remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO13
  id: ir_transmitter

panaac_v2:
  name: "Remote Controller"
  id: panaac_v2_climate
  receiver_id: ir_receiver
  transmitter_id: ir_transmitter
  topic_prefix: "panaac_v2/${device_name}"
  hide_legacy_comps: false
  supports_cool: true
  supports_heat: true
  supports_fan_only: false
  supports_quiet: true
  fan_5level: false
  swing_horizontal: false
  temp_step: 0.5
  ir_control: true
